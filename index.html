
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <h1>⚡ROCK PAPER Scissor</h1>
        <p class="subtitle">Choose your weapon. Beat the computer!</p>

        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="score-box">
                <h3>YOU</h3>
                <span id="userScore">0</span>
            </div>

            <div class="vs">VS</div>

            <div class="score-box">
                <h3>COMPUTER</h3>
                <span id="computerScore">0</span>
            </div>
        </div>

        <!-- Game result -->
        <div class="result-box">
            <p id="message">Make your first move!</p>

            <div class="choices-display">
                <div>
                    <span id="userChoice">❔</span>
                    <small>You</small>
                </div>

                <div class="vs">VS</div>

                <div>
                    <span id="computerChoice">❔</span>
                    <small>Computer</small>
                </div>
            </div>
        </div>

        <!-- Game buttons -->
        <h3 class="choose-text">CHOOSE YOUR MOVE</h3>

        <div class="buttons">
            <button onclick="playGame('rock')">
                ✊ <span>Rock</span>
            </button>

            <button onclick="playGame('paper')">
                ✋ <span>Paper</span>
            </button>

            <button onclick="playGame('scissors')">
                ✌️ <span>Scissors</span>
            </button>
        </div>

        <button class="restart-btn" onclick="restartGame()">
            ↻ Restart Game
        </button>

        <p class="footer">Made with ❤️ using HTML, CSS & JavaScript</p>

    </div>

    <script src="script.js"></script>
</body>
</html>
